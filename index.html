<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音楽会 打ち上げクイズ</title>
<style>
:root{
  --bg:#fbf4e6; --card:#fffdf8; --ink:#2a2233; --sub:#7a6f80; --line:#eadfca;
  --red:#d9412b; --navy:#27316b; --gold:#e8a817; --green:#3c9a62; --blue:#2f7fc1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
header.top{text-align:center;padding:10px 0 6px}
header.top .kicker{font-size:13px;letter-spacing:.3em;color:var(--red);font-weight:800}
header.top h1{font-size:30px;margin:6px 0 4px;letter-spacing:.06em;color:var(--navy)}
.staff{height:22px;margin:4px auto 0;max-width:260px;
  background:repeating-linear-gradient(to bottom,transparent 0 3px,#cdbf9f 3px 4px);opacity:.7}
.notice{background:#fff3d6;border:2px solid #f1d48a;border-radius:14px;padding:12px 14px;
  font-size:14px;line-height:1.7;margin:16px 0}
.notice b{color:var(--red)}
.menu{display:grid;gap:12px;margin-top:8px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:18px;
  background:var(--card);box-shadow:0 2px 0 var(--line),0 0 0 2px var(--line) inset;
  color:var(--ink);text-align:left;cursor:pointer;text-decoration:none;font:inherit}
.mbtn:active{transform:translateY(1px)}
.mbtn .no{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:900;color:#fff}
.mbtn .tx b{display:block;font-size:20px}
.mbtn .tx span{font-size:13px;color:var(--sub)}
.c1{background:var(--blue)}.c2{background:var(--green)}.c3{background:var(--red)}.c4{background:var(--gold)}
/* quiz */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:none;color:var(--sub);font-size:15px;padding:6px 0;cursor:pointer;font:inherit}
.bar h2{flex:1;text-align:right;margin:0;font-size:18px;color:var(--navy)}
.tabs{display:flex;gap:8px;margin:6px 0 14px}
.tabs button{flex:1;padding:12px 0;font-size:20px;font-weight:900;border-radius:12px;cursor:pointer;
  border:2px solid var(--line);background:var(--card);color:var(--sub);font-family:inherit}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qcard{background:var(--card);border-radius:20px;padding:20px 18px 24px;
  box-shadow:0 0 0 2px var(--line) inset}
.qno{display:inline-block;font-size:15px;font-weight:900;color:#fff;background:var(--red);
  padding:4px 14px;border-radius:999px;letter-spacing:.1em}
.qtext{font-size:24px;line-height:1.6;font-weight:800;margin:16px 0 6px}
.flip{font-size:13px;color:var(--sub);margin-top:14px;text-align:center}
.photo{margin-top:14px;border-radius:14px;overflow:hidden;background:#efe6d4;cursor:zoom-in}
.photo{position:relative}
.photo img{display:block;width:100%;height:auto}
.pno{position:absolute;left:8px;top:8px;background:rgba(39,49,107,.9);color:#fff;
  font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px}
.photo.empty{border:3px dashed #d6c7a6;height:220px;display:flex;align-items:center;
  justify-content:center;color:#a8987a;font-size:16px;cursor:default}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  font-size:16px;font-weight:800;color:var(--navy);cursor:pointer;font-family:inherit}
.nav button:disabled{opacity:.35}
/* intro */
.era{font-size:34px;font-weight:900;color:var(--navy);margin:14px 0 4px;letter-spacing:.04em}
.playwrap{display:flex;flex-direction:column;align-items:center;margin:18px 0 6px}
.pbtn{position:relative;width:170px;height:170px;border-radius:50%;border:0;cursor:pointer;
  background:var(--red);color:#fff;font-size:24px;font-weight:900;font-family:inherit;
  box-shadow:0 6px 0 #a52e1d}
.pbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #a52e1d}
.pbtn.playing{background:var(--navy);box-shadow:0 6px 0 #161c44}
.pbtn svg{position:absolute;inset:-10px;width:190px;height:190px;transform:rotate(-90deg);pointer-events:none}
.pbtn circle{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round}
.hint{font-size:13px;color:var(--sub);margin-top:16px;text-align:center}
body.single #toHome{display:none}
body.single .bar h2{text-align:left}
/* zoom */
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:9;overflow:auto;
  -webkit-overflow-scrolling:touch}
#zoom.on{display:block}
#zoom img{display:block;width:100%;height:auto;margin:auto}
#zoom .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;background:#fff;border:0;
  border-radius:999px;padding:9px 16px;font-size:15px;font-weight:800;font-family:inherit}
</style>
</head>
<body>

<!-- ===== メニュー ===== -->
<div id="home" class="screen on"><div class="wrap">
  <header class="top">
    <div class="kicker">音楽会 打ち上げ</div>
    <h1>テーブル対抗クイズ</h1>
    <div class="staff"></div>
  </header>

  <div class="notice">
    答えは<b>テーブルのフリップ</b>に書いてください。<br>
    🔈 音が出る問題があります。<b>iPhoneは消音スイッチ（マナーモード）をオフ</b>にして、
    音量を上げてテーブルの真ん中に置いてください。
  </div>

  <div class="menu">
    <button class="mbtn" data-go="photo"><span class="no c1">1</span>
      <span class="tx"><b>写真クイズ</b><span>何先生のクラス？</span></span></button>
    <button class="mbtn" data-go="nazo"><span class="no c2">2</span>
      <span class="tx"><b>音楽なぞなぞ</b><span>全5問</span></span></button>
    <button class="mbtn" data-go="intro"><span class="no c3">3</span>
      <span class="tx"><b>イントロドン</b><span>年代別 全5曲</span></span></button>
    <a class="mbtn" href="kouka.html"><span class="no c4">4</span>
      <span class="tx"><b>校歌の達人</b><span>テーブル代表が挑戦！</span></span></a>
  </div>
</div></div>

<!-- ===== クイズ共通 ===== -->
<div id="quiz" class="screen"><div class="wrap">
  <div class="bar"><button class="back" id="toHome">← メニュー</button><h2 id="qtitle"></h2></div>
  <div class="tabs" id="tabs"></div>
  <div class="qcard" id="qcard"></div>
  <div class="nav"><button id="prev">← まえ</button><button id="next">つぎ →</button></div>
</div></div>

<div id="zoom"><button class="x" id="zoomX">とじる ✕</button><img id="zoomImg" alt=""></div>

<script>
"use strict";
const QUIZ = {"photo": [{"q": "この写真は　何先生の　クラス？", "imgs": ["p1.jpg", "p2.jpg"]}, {"q": "この写真は　何先生の　クラス？", "imgs": ["p7.jpg", "p8.jpg"]}, {"q": "この写真は　何先生の　クラス？", "imgs": ["p5.jpg", "p6.jpg"]}, {"q": "この写真は　何先生の　クラス？", "imgs": ["p3.jpg", "p4.jpg"]}], "nazo": [{"q": "まわりから「しっぽを借りた方がいい」と言われる楽器は？"}, {"q": "ケンくんは　リコーダーを４本同時に「ふく」ことができます。<br>どうやって？"}, {"q": "１週間の中で聴ける、美しい音色の楽器は何？"}, {"q": "音が４回鳴ったら　寄ってくる人はだれ？"}, {"q": "音楽会のスローガンは何でしょう？"}], "intro": [{"era": "1980年代", "file": "intro_1980.mp3"}, {"era": "1990年代", "file": "intro_1990.mp3"}, {"era": "2000年代", "file": "intro_2000.mp3"}, {"era": "2010年代", "file": "intro_2010.mp3"}, {"era": "2020年代", "file": "intro_2020.mp3"}]};
const $ = id => document.getElementById(id);
const TITLES = {photo:"① 写真クイズ", nazo:"② 音楽なぞなぞ", intro:"③ イントロドン"};
let kind = null, cur = 0;
const audio = new Audio(); audio.preload = "auto";
let raf = 0;

function show(id){ ["home","quiz"].forEach(s => $(s).classList.toggle("on", s === id)); window.scrollTo(0,0); }

function openQuiz(k){
  kind = k; cur = 0;
  $("qtitle").textContent = TITLES[k];
  const tabs = $("tabs"); tabs.innerHTML = "";
  QUIZ[k].forEach((_, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.onclick = () => go(i);
    tabs.appendChild(b);
  });
  if(k === "intro") QUIZ.intro.forEach(q => { const a = new Audio(); a.preload = "auto"; a.src = ""+q.file; });
  show("quiz"); go(0);
}

function stopAudio(){ audio.pause(); cancelAnimationFrame(raf); }

function go(i){
  stopAudio();
  cur = i;
  [...$("tabs").children].forEach((b, j) => b.classList.toggle("on", j === i));
  $("prev").disabled = i === 0;
  $("next").disabled = i === QUIZ[kind].length - 1;
  const q = QUIZ[kind][i], box = $("qcard");
  const no = '<span class="qno">第' + (i + 1) + '問</span>';
  if(kind === "photo"){
    const imgs = q.imgs || [];
    box.innerHTML = no + '<div class="qtext">' + q.q + '</div>'
      + (imgs.length
          ? imgs.map((im, j) => '<div class="photo" data-im="' + im + '">'
              + (imgs.length > 1 ? '<span class="pno">写真' + (j + 1) + '</span>' : '')
              + '<img src="' + im + '" alt=""></div>').join("")
          : '<div class="photo empty">写真が入ります</div>')
      + '<div class="flip">写真をタップすると大きく見られます<br>✏️ 答えはフリップへ</div>';
    box.querySelectorAll("[data-im]").forEach(el => el.onclick = () => {
      $("zoomImg").src = ""+el.dataset.im; $("zoom").classList.add("on");
    });
  }else if(kind === "nazo"){
    box.innerHTML = no + '<div class="qtext">' + q.q + '</div>'
      + '<div class="flip">✏️ 答えはフリップへ</div>';
  }else{
    box.innerHTML = no + '<div class="era">' + q.era + '</div>'
      + '<div class="playwrap"><button class="pbtn" id="pb">'
      + '<svg viewBox="0 0 190 190"><circle id="ring" cx="95" cy="95" r="88"/></svg>'
      + '<span id="pl">▶ きく</span></button></div>'
      + '<div class="hint">曲名をフリップに書いてください（何回でも聞けます）</div>';
    const C = 2 * Math.PI * 88, ring = $("ring");
    ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C;
    $("pb").onclick = () => {
      if(!audio.paused){ stopAudio(); audio.currentTime = 0; reset(); return; }
      audio.src = ""+q.file;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      $("pb").classList.add("playing"); $("pl").textContent = "■ とめる";
      const tick = () => {
        const d = audio.duration || 1;
        ring.style.strokeDashoffset = C * (1 - Math.min(1, audio.currentTime / d));
        if(!audio.paused) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    function reset(){
      ring.style.strokeDashoffset = C;
      const pb = $("pb"); if(!pb) return;
      pb.classList.remove("playing"); $("pl").textContent = "▶ もう一度";
    }
    audio.onended = reset;
  }
}

document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => openQuiz(b.dataset.go));
$("toHome").onclick = () => { stopAudio(); show("home"); };
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("zoomX").onclick = () => $("zoom").classList.remove("on");
$("zoom").onclick = e => { if(e.target.id === "zoom") $("zoom").classList.remove("on"); };

/* QRコードから開いたとき（?s=nazo など）：そのコーナーを直接ひらく */
(function(){
  const k = new URLSearchParams(location.search).get("s");
  if(!QUIZ[k]) return;
  document.body.classList.add("single");
  openQuiz(k);
})();
</script>
</body>
</html>
